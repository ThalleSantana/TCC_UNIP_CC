<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Analisar</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <style type="text/tailwindcss">
    :root { --primary-color: #3d99f5; }
    body { font-family: 'Spline Sans', sans-serif; }
  </style>
</head>
<body class="bg-gray-50" data-page="home">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-lg space-y-6">
      <h1 class="text-3xl font-bold text-gray-800 text-center">Analisar Postagem</h1>
      <p class="text-gray-500 text-center">Cole o link da postagem e selecione a rede social para analisar o sentimento.</p>

      <div>
        <label for="post-url" class="block text-sm font-medium text-gray-700">Link da Postagem</label>
        <input
          id="post-url"
          type="url"
          placeholder="https://..."
          data-input="url"
          required
          class="mt-1 block w-full px-4 py-3 border border-gray-300 rounded-md shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
        />
      </div>

      <div>
        <span class="block text-sm font-medium text-gray-700">Rede Social</span>
        <div class="mt-2 flex flex-wrap gap-4">
          <label class="flex items-center space-x-2">
            <input type="radio" name="platform" value="instagram" data-input="platform">
            <span>Instagram</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="platform" value="youtube" data-input="platform" checked>
            <span>YouTube</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="platform" value="tiktok" data-input="platform">
            <span>TikTok</span>
          </label>
          <label class="flex items-center space-x-2">
            <input type="radio" name="platform" value="x" data-input="platform">
            <span>X (Twitter)</span>
          </label>
        </div>
      </div>

      <div class="pt-4">
        <button
          data-action="analyze"
          class="w-full py-3 px-4 bg-[var(--primary-color)] hover:bg-blue-700 text-white font-medium rounded-md shadow focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
          Analisar Postagem
        </button>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=1.0"></script>

</body>
</html>
