<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync — Redefinir Senha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/frontend/css/styles.css"/>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen font-['Spline_Sans']">
  <div class="w-full max-w-6xl mx-auto p-8 lg:p-12">
    <div class="grid lg:grid-cols-2 gap-0 items-stretch rounded-2xl shadow-xl overflow-hidden">
      <div class="flex flex-col items-center justify-center text-center p-10 gap-6 text-white"
           style="background-color:#3d99f5;">
        <h1 class="text-4xl font-bold">EmoSync</h1>
        <p class="text-white/90 text-lg leading-snug">
          Software de Análise de Sentimento em Redes Sociais.
        </p>
      </div>
      <div class="bg-white p-8 sm:p-12 h-full flex flex-col justify-center relative">
        <div id="successMessage" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm rounded-2xl z-10">
          <div class="flex flex-col items-center text-center animate-fade-in">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-16 h-16 text-green-500 mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            <h3 class="text-2xl font-semibold text-gray-800 mb-2">Senha redefinida!</h3>
            <p class="text-gray-500 mb-6">Você será redirecionada para o login.</p>
            <div class="flex justify-center">
              <div class="w-32 h-1.5 bg-[var(--primary-color)] rounded-full animate-pulse"></div>
            </div>
          </div>
        </div>
        <h2 class="text-3xl font-semibold text-gray-900 mb-8">Definir nova senha</h2>
        <form id="resetForm" onsubmit="event.preventDefault(); onSubmitNewPassword();" class="space-y-6">
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Nova senha</label>
            <input
              id="password"
              type="password"
              placeholder="Digite sua nova senha"
              class="w-full rounded-lg border-gray-300 focus:border-[#3d99f5] focus:ring-[#3d99f5]"
              required
            />
          </div>
          <button
            type="submit"
            class="w-full rounded-lg text-white py-2.5 font-semibold transition hover:brightness-95"
            style="background-color:#3d99f5;"
          >
            Salvar nova senha
          </button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-6">
          <a href="login.html" class="hover:underline" style="color:#3d99f5;">Voltar ao login</a>
        </p>
      </div>
    </div>
  </div>
  <script src="/frontend/js/app.js?v=1.0"></script>
  <script>
    async function onSubmitNewPassword(){
      const url = new URL(window.location.href);
      const token = url.searchParams.get("token");
      const password = document.getElementById("password").value;
      const successMessage = document.getElementById("successMessage");
      const form = document.getElementById("resetForm");

      try{
        await handleResetConfirm(token, password);
        form.classList.add("opacity-0", "pointer-events-none");
        successMessage.classList.remove("hidden");
        setTimeout(() => {
          window.location.href = "/frontend/html/login.html";
        }, 2500);
      }catch(e){
        alert(e.message || "Erro ao redefinir.");
      }
    }
  </script>

  <style>
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 0.6s ease-out forwards;
    }
  </style>
</body>
</html>
