<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/frontend/css/styles.css"/>
</head>

<body class="bg-gray-50 flex items-center justify-center min-h-screen font-['Spline_Sans']">
  <div class="w-full max-w-5xl mx-auto p-6">
    <div class="grid lg:grid-cols-2 rounded-2xl shadow-2xl overflow-hidden">
      <div class="flex flex-col justify-center items-center text-center p-10 text-white"
           style="background-color:#3d99f5;">
        <h1 class="text-4xl font-bold mb-4">EmoSync</h1>
        <p class="text-white/90 text-lg leading-snug">
          Software de Análise de Sentimento em Redes Sociais
        </p>
      </div>
      <div class="bg-white p-10 sm:p-12 flex flex-col justify-center">
        <h2 class="text-3xl font-semibold text-gray-900 mb-8 text-center">Bem-vindo(a)</h2>
        <form data-form="login" class="space-y-6">
          <div>
            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="voce@exemplo.com"
              required
              class="w-full rounded-lg border-gray-300 focus:border-[#3d99f5] focus:ring-[#3d99f5]"
            />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Senha</label>
            <input
              id="password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="••••••••"
              required
              class="w-full rounded-lg border-gray-300 focus:border-[#3d99f5] focus:ring-[#3d99f5]"
            />
          </div>
          <div class="text-right">
            <a href="reset.html" class="text-sm font-medium hover:underline" style="color:#3d99f5;">
              Esqueceu sua senha?
            </a>
          </div>
          <div class="flex items-center justify-between space-x-4 pt-4">
            <button
              type="button"
              onclick="window.location.href='register.html'"
              class="w-full rounded-lg border border-gray-300 text-gray-700 bg-white py-2.5 font-medium hover:bg-gray-50 transition">
              Cadastrar
            </button>
            <button
              type="submit"
              class="w-full rounded-lg text-white py-2.5 font-semibold transition hover:brightness-95"
              style="background-color:#3d99f5;">
              Entrar
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <script src="../js/app.js?v=999"></script>
</body>
</html>
