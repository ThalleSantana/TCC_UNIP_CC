<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Salvar Análise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/frontend/css/styles.css" />
</head>
<body class="bg-[var(--bg-color)]" style='font-family: "Spline Sans", "Noto Sans", sans-serif;' data-page="save">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[var(--sidebar-bg)] shadow-md flex flex-col justify-between p-4">
      <div>
        <h1 class="text-[var(--text-color)] text-2xl font-bold mb-8 text-center">EmoSync</h1>
        <nav class="flex flex-col gap-2">
          <a class="flex items-center gap-3 px-4 py-3 rounded-md hover:bg-gray-100 text-[var(--text-color)] font-medium" href="post.html">
            <svg fill="none" height="24" width="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Analisar</span>
          </a>
          <a class="flex items-center gap-3 px-4 py-3 rounded-md hover:bg-gray-100 text-[var(--text-color)] font-medium" href="history.html">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
              <path d="M12 6v6l4 2"></path>
            </svg>
            <span>Histórico</span>
          </a>
          <a class="flex items-center gap-3 px-4 py-3 rounded-md bg-[var(--sidebar-active-bg)] text-[var(--text-color)] font-semibold" href="save.html">
            <svg fill="none" height="24" width="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span>Salvar</span>
          </a>
        </nav>
      </div>
      <div class="flex flex-col">
        <a onclick="handleLogout()" href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-md hover:bg-gray-100 text-[var(--text-color)] font-medium">
          <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
          </svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>
    <main class="flex flex-1 items-center justify-center">
      <div class="min-h-screen flex items-center justify-center p-6">
        <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-xl space-y-6">
          <h1 class="text-3xl font-bold text-gray-800 text-center">Salvar Análise</h1>
          <p class="text-gray-500 text-center">
            Sua análise foi concluída. Você pode salvar uma anotação/título para encontrá-la depois no histórico.
          </p>
          <div class="bg-gray-50 border border-gray-200 rounded-md p-4">
            <span class="block text-sm text-gray-600">ID da Análise</span>
            <code class="text-base font-mono" id="analysis-id">—</code>
          </div>
          <form id="save-form" class="space-y-4">
            <div>
              <label for="note" class="block text-sm font-medium text-gray-700">Título/Anotação (opcional)</label>
              <input type="text" id="note" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]" placeholder="Ex.: Campanha do Dia das Mães">
            </div>
            <div class="flex items-center justify-between gap-3">
              <button type="submit" class="w-full py-2 px-4 bg-[var(--primary-color)] hover:bg-blue-700 text-white rounded-md shadow">Salvar</button>
            </div>
          </form>
        </div>
      </div>
    </main>
  </div>
  <script src="/frontend/js/app.js?v=1.0"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const id = localStorage.getItem('last_analysis_id');
      document.getElementById('analysis-id').textContent = id || '—';

      const key = id ? `note:${id}` : null;
      const input = document.getElementById('note');
      if (key) {
        const existing = localStorage.getItem(key);
        if (existing) input.value = existing;
      }

      document.getElementById('save-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!id) {
          alert('Nenhuma análise recente encontrada.');
          return;
        }
        localStorage.setItem(`note:${id}`, input.value.trim());
        alert('Salvo com sucesso! Você pode encontrá-la no Histórico.');
        window.location.href = 'history.html';
      });
    });
  </script>
</body>
</html>
