<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Login</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-gray-50">
  <div class="min-h-screen flex items-center justify-center">
    <div class="flex flex-col md:flex-row w-full max-w-4xl shadow-2xl rounded-2xl overflow-hidden">
      <!-- Lado esquerdo -->
      <div class="w-full md:w-1/2 bg-[var(--primary-color)] text-white p-12 flex flex-col justify-center items-center text-center">
        <div class="space-y-4">
          <h1 class="text-4xl font-bold">EmoSync</h1>
          <p class="text-lg">Software de Análise de Sentimento em Redes Sociais</p>
        </div>
      </div>

      <!-- Lado direito -->
      <div class="w-full md:w-1/2 bg-white p-12">
        <div class="w-full max-w-md mx-auto">
          <h2 class="text-3xl font-bold text-gray-800 mb-6 text-center">Bem-vindo(a)</h2>

          <form class="space-y-6" data-form="login">
            <div>
              <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
              <div class="mt-1">
                <input
                  id="email"
                  name="email"
                  type="email"
                  autocomplete="email"
                  placeholder="voce@exemplo.com"
                  required
                  class="form-input block w-full px-4 py-3 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                />
              </div>
            </div>

            <div>
              <label for="password" class="block text-sm font-medium text-gray-700">Senha</label>
              <div class="mt-1">
                <input
                  id="password"
                  name="password"
                  type="password"
                  autocomplete="current-password"
                  placeholder="••••••••"
                  required
                  class="form-input block w-full px-4 py-3 rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm"
                />
              </div>
            </div>

            <div class="text-right">
              <a href="reset.html" class="text-sm font-medium text-[var(--primary-color)] hover:text-blue-700">
                Esqueceu sua senha?
              </a>
            </div>

            <div class="flex items-center justify-between pt-4 space-x-4">
              <button
                type="button"
                onclick="window.location.href='register.html'"
                class="w-full flex justify-center py-3 px-4 border border-gray-300 rounded-md shadow-sm text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                Cadastrar
              </button>

              <button
                type="submit"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-[var(--primary-color)] hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500">
                Entrar
              </button>
            </div>
          </form>
        </div>
      </div>

    </div>
  </div>

  <script src="../js/app.js?v=1.0"></script>

</body>
</html>
