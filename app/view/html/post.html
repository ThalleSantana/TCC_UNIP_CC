<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Analisar</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-[var(--bg-color)]" style='font-family: "Spline Sans", "Noto Sans", sans-serif;' data-page="home">
  <div class="flex min-h-screen">
    <aside class="w-64 bg-[var(--sidebar-bg)] shadow-md flex flex-col justify-between p-4">
      <div>
        <h1 class="text-[var(--text-color)] text-2xl font-bold mb-8 text-center">EmoSync</h1>
        <nav class="flex flex-col gap-2">
          <a class="flex items-center gap-3 px-4 py-3 rounded-md bg-[var(--sidebar-active-bg)] text-[var(--text-color)] font-semibold" href="post.html">
            <svg fill="none" height="24" width="24" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Analisar</span>
          </a>
          <a class="flex items-center gap-3 px-4 py-3 rounded-md hover:bg-gray-100 text-[var(--text-color)] font-medium" href="history.html">
            <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"></path>
              <path d="M12 6v6l4 2"></path>
            </svg>
            <span>Histórico</span>
          </a>
        </nav>
      </div>
      <div class="flex flex-col">
        <a onclick="handleLogout()" href="login.html" class="flex items-center gap-3 px-4 py-3 rounded-md hover:bg-gray-100 text-[var(--text-color)] font-medium">
          <svg fill="none" height="24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" x2="9" y1="12" y2="12"></line>
          </svg>
          <span>Sair</span>
        </a>
      </div>
    </aside>
    <main class="flex-1 flex flex-col items-center justify-center p-6">
      <div class="w-full max-w-2xl text-center">
        <h2 class="text-3xl md:text-4xl font-bold text-[var(--text-color)] mb-2">Bem Vindo ao EmoSync</h2>
        <p class="text-lg text-gray-500 mb-10">Analisador de Sentimentos para Redes Sociais</p>
        <div class="bg-white p-8 rounded-lg shadow-lg w-full">
          <div class="mb-6">
            <label class="block text-left text-sm font-medium text-gray-700 mb-2" for="youtube-link">Link para Analisar</label>
            <input class="form-input w-full px-4 py-3 rounded-md border-[var(--input-border)] focus:ring-[var(--input-focus-border)] focus:border-[var(--input-focus-border)] placeholder:text-[var(--placeholder-color)] text-[var(--text-color)]" id="post-url" placeholder="https://www.youtube.com/watch?v=..." type="url" data-input="url" required/>
          </div>
          <div class="mb-8">
            <p class="block text-left text-sm font-medium text-gray-700 mb-3">Rede Social</p>
            <div class="mt-2 flex flex-wrap justify-center gap-4">
              <label class="flex items-center space-x-2">
                <input type="radio" name="platform" value="instagram" data-input="platform">
                <span>Instagram</span>
              </label>
              <label class="flex items-center space-x-2">
                <input type="radio" name="platform" value="youtube" data-input="platform" checked>
                <span>YouTube</span>
              </label>
              <label class="flex items-center space-x-2">
                <input type="radio" name="platform" value="tiktok" data-input="platform">
                <span>TikTok</span>
              </label>
              <label class="flex items-center space-x-2">
                <input type="radio" name="platform" value="x" data-input="platform">
                <span>X (Twitter)</span>
              </label>
            </div>
          </div>
          <button data-action="analyze" class="w-full bg-[var(--primary-color)] hover:bg-[var(--primary-color-hover)] text-[var(--button-text-color)] font-bold py-3 px-4 rounded-md text-lg transition-colors duration-300">
            Analisar
          </button>
        </div>
      </div>
    </main>
  </div>

  <script src="../js/app.js?v=1.0"></script>

</body>
</html>
