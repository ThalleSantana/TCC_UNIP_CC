<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Salvar Análise</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-gray-50" data-page="save">
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-xl space-y-6">
      <h1 class="text-3xl font-bold text-gray-800 text-center">Salvar Análise</h1>
      <p class="text-gray-500 text-center">
        Sua análise foi concluída. Você pode salvar uma anotação/título para encontrá-la depois no histórico.
      </p>

      <!-- ID da última análise (preenchido via JS) -->
      <div class="bg-gray-50 border border-gray-200 rounded-md p-4">
        <span class="block text-sm text-gray-600">ID da Análise</span>
        <code class="text-base font-mono" id="analysis-id">—</code>
      </div>

      <!-- Formulário simples de anotação local (não precisa de API nova) -->
      <form id="save-form" class="space-y-4">
        <div>
          <label for="note" class="block text-sm font-medium text-gray-700">Título/Anotação (opcional)</label>
          <input type="text" id="note" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-[var(--primary-color)] focus:ring-[var(--primary-color)]" placeholder="Ex.: Campanha do Dia das Mães">
        </div>

        <div class="flex items-center justify-between gap-3">
          <button type="button" onclick="window.location.href='post.html'"
                  class="w-full py-2 px-4 bg-gray-200 hover:bg-gray-300 text-gray-800 rounded-md shadow">
            Nova Análise
          </button>
          <button type="submit"
                  class="w-full py-2 px-4 bg-[var(--primary-color)] hover:bg-blue-700 text-white rounded-md shadow">
            Salvar
          </button>
        </div>
      </form>

      <p class="text-center text-sm text-gray-500">
        Ver tudo em <a href="history.html" class="text-[var(--primary-color)] hover:underline">Histórico</a>
      </p>
    </div>
  </div>

  <!-- Carrega o JS com cache-busting -->
  <script src="../js/app.js?v=1.0"></script>
  <script>
    // Pequeno script local só para mostrar o ID e guardar a anotação no localStorage.
    // (Não cria API nova — seu histórico oficial vem da própria API /analysis/)
    document.addEventListener('DOMContentLoaded', () => {
      const id = localStorage.getItem('last_analysis_id');
      document.getElementById('analysis-id').textContent = id || '—';

      // Carrega/salva uma notinha local (chave: note:<id>)
      const key = id ? `note:${id}` : null;
      const input = document.getElementById('note');
      if (key) {
        const existing = localStorage.getItem(key);
        if (existing) input.value = existing;
      }

      document.getElementById('save-form').addEventListener('submit', (e) => {
        e.preventDefault();
        if (!id) {
          alert('Nenhuma análise recente encontrada.');
          return;
        }
        localStorage.setItem(`note:${id}`, input.value.trim());
        alert('Salvo com sucesso! Você pode encontrá-la no Histórico.');
        window.location.href = 'history.html';
      });
    });
  </script>
</body>
</html>
