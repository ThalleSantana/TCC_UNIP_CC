<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EmoSync - Resultado da Análise</title>
  <link rel="icon" type="image/x-icon" href="data:image/x-icon;base64,"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body class="bg-gray-50" data-page="result">
  <div class="min-h-screen flex flex-col items-center p-6">
    <div class="bg-white shadow-2xl rounded-2xl p-8 w-full max-w-3xl space-y-6">
      <h1 class="text-3xl font-bold text-gray-800 text-center">Resultado da Análise</h1>
      <p class="text-gray-500 text-center">Veja abaixo o resumo e os comentários analisados.</p>

      <!-- Resumo -->
      <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 text-center">
        <div class="bg-green-100 p-4 rounded-lg shadow">
          <h2 class="text-lg font-semibold text-green-700">Positivos</h2>
          <p class="text-2xl font-bold text-green-900" data-count-positive>0</p>
        </div>
        <div class="bg-yellow-100 p-4 rounded-lg shadow">
          <h2 class="text-lg font-semibold text-yellow-700">Neutros</h2>
          <p class="text-2xl font-bold text-yellow-900" data-count-neutral>0</p>
        </div>
        <div class="bg-red-100 p-4 rounded-lg shadow">
          <h2 class="text-lg font-semibold text-red-700">Negativos</h2>
          <p class="text-2xl font-bold text-red-900" data-count-negative>0</p>
        </div>
      </div>

      <!-- Lista de comentários -->
      <div>
        <h2 class="text-xl font-semibold text-gray-800 mb-3">Comentários</h2>
        <ul class="space-y-2" data-comments>
          <!-- Comentários serão inseridos pelo JS -->
        </ul>
      </div>

      <!-- Botões de navegação -->
      <div class="flex justify-between pt-4">
        <button onclick="window.location.href='post.html'"
          class="py-2 px-4 bg-gray-200 hover:bg-gray-300 rounded-md shadow">
          Nova Análise
        </button>
        <button onclick="window.location.href='history.html'"
          class="py-2 px-4 bg-[var(--primary-color)] hover:bg-blue-700 text-white rounded-md shadow">
          Ver Histórico
        </button>
      </div>
    </div>
  </div>

  <script src="../js/app.js?v=1.0"></script>

</body>
</html>
